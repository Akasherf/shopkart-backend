services:

  mysql:
    image: mysql:8.4
    container_name: shopkart-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopkart_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopkart-app
    depends_on:
      - mysql
    ports:
      - "8083:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: always

volumes:
  mysql_data:
